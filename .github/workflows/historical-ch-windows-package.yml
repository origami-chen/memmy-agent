name: Historical CH Windows package

on:
  push:
    branches: [codex/package-ch-d5e79e0b7]
    paths: [.github/workflows/historical-ch-windows-package.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      SOURCE_SHA: d5e79e0b7b483bdcbb23a1f1ecc10c424f89898b
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      MEMMY_CLOUD_SERVICE: https://api.memmy.cn
      MEMMY_LEGAL_CN_BASE_URL: https://memmy.cn
      MEMMY_LEGAL_INTL_BASE_URL: https://memmy.bot
    steps:
      - name: Check out the exact historical source
        uses: actions/checkout@v4
        with:
          repository: MemTensor/memmy-agent
          ref: d5e79e0b7b483bdcbb23a1f1ecc10c424f89898b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          architecture: x64
      - name: Record source and build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) { throw 'Unexpected source commit' }
          if (git status --porcelain) { throw 'Source checkout is not clean' }
          New-Item -ItemType Directory -Force -Path build-evidence | Out-Null
          $record = [ordered]@{
            source_commit = (git rev-parse HEAD).Trim()
            source_tree = (git rev-parse 'HEAD^{tree}').Trim()
            source_version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            workflow_commit = '${{ github.sha }}'
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            image_version = $env:ImageVersion
            node = (node --version)
            npm = (npm --version)
            command = 'bash scripts/package-win.sh --version 1.1.8 --arch x64 --edition cn --sign unsigned'
            built_at_utc = (Get-Date).ToUniversalTime().ToString('o')
            build_adjustment = 'Remove only an undeclared generated Memory runtime backlink to the source root before packaging; product source unchanged'
            runtime_acceptance = 'Not performed; Windows manual validation required'
          }
          $record | ConvertTo-Json | Set-Content build-evidence/build-manifest.json
      - name: Install locked root dependencies
        shell: bash
        run: npm ci
      - name: Build the historical Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DEBUG = 'electron-builder'
          # Remove only the demonstrated extraneous backlink from generated staging.
          $guardScript = @'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = fs.realpathSync(process.cwd());
          const runtime = path.join(root, 'App/shell/desktop/dist/runtime/memory');
          const manifest = JSON.parse(fs.readFileSync(path.join(runtime, 'package.json'), 'utf8'));
          const name = 'memmy-agent';
          for (const key of ['dependencies', 'optionalDependencies', 'peerDependencies', 'devDependencies']) {
            if (manifest[key]?.[name]) throw new Error('Backlink name is a declared runtime dependency');
          }
          const link = path.join(runtime, 'node_modules', name);
          const evidence = { link, source_root: root, product_source_changed: false };
          if (fs.existsSync(link)) {
            const stat = fs.lstatSync(link);
            const target = fs.realpathSync(link);
            if (!stat.isSymbolicLink() || target.toLowerCase() !== root.toLowerCase()) {
              throw new Error('Refusing to remove anything except the verified source-root backlink');
            }
            evidence.target = target;
            evidence.link_target = fs.readlinkSync(link);
            fs.unlinkSync(link);
            evidence.removed = true;
          } else evidence.removed = false;
          if (fs.existsSync(link)) throw new Error('Backlink still exists');
          fs.writeFileSync('build-evidence/staging-backlink.json', JSON.stringify(evidence, null, 2));
          console.log('Verified staging backlink cleanup:', evidence);
          '@
          [IO.File]::WriteAllText((Join-Path $PWD 'build-evidence/remove-staging-backlink.cjs'), $guardScript, [Text.UTF8Encoding]::new($false))
          $packScriptPath = Join-Path $PWD 'scripts/internal/win/build-nsis.sh'
          $packScript = [IO.File]::ReadAllText($packScriptPath)
          $needle = 'package_step_start "Run electron-builder Windows NSIS packaging"'
          if (-not $packScript.Contains($needle)) { throw 'Packaging insertion point not found' }
          $packScript = $packScript.Replace($needle, 'node "$ROOT_DIR/build-evidence/remove-staging-backlink.cjs"' + "`n" + $needle)
          [IO.File]::WriteAllText($packScriptPath, $packScript, [Text.UTF8Encoding]::new($false))
          git diff -- scripts/internal/win/build-nsis.sh | Set-Content build-evidence/packaging-only-adjustment.patch
          $buildScript = @'
          set -euo pipefail
          bash scripts/package-win.sh --version 1.1.8 --arch x64 --edition cn --sign unsigned
          '@
          [IO.File]::WriteAllText((Join-Path $PWD 'build-evidence/run-package.sh'), $buildScript.Replace("`r`n", "`n") + "`n", [Text.UTF8Encoding]::new($false))
          $buildProcess = Start-Process -FilePath 'C:\Program Files\Git\bin\bash.exe' -ArgumentList '--noprofile', '--norc', 'build-evidence/run-package.sh' -PassThru -NoNewWindow -RedirectStandardOutput build-evidence/package-stdout.log -RedirectStandardError build-evidence/package-stderr.log
          while (-not $buildProcess.WaitForExit(60000)) {
            Write-Host "Build heartbeat: $((Get-Date).ToUniversalTime().ToString('o'))"
            Get-Process node,bash,powershell,app-builder,7za,makensis -ErrorAction SilentlyContinue | Select-Object Id,ProcessName,CPU,WorkingSet64 | Format-Table
            Get-Item 'App/shell/desktop/release/win-unpacked/resources/app.asar','App/shell/desktop/release/Memmy-1.1.8-win32-x64-cn-unsigned.exe' -ErrorAction SilentlyContinue | Select-Object Name,Length,LastWriteTimeUtc | Format-Table
            Get-Content build-evidence/package-stdout.log -Tail 10
            Get-Content build-evidence/package-stderr.log -Tail 10
          }
          $buildProcess.WaitForExit()
          Get-Content build-evidence/package-stdout.log -Tail 60
          Get-Content build-evidence/package-stderr.log -Tail 30
          if ($buildProcess.ExitCode -ne 0) { throw "Historical package command failed with exit code $($buildProcess.ExitCode)" }
      - name: Verify installer and generate checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = 'App/shell/desktop/release/Memmy-1.1.8-win32-x64-cn-unsigned.exe'
          if (-not (Test-Path $installer)) { throw 'Expected installer is missing' }
          $file = Get-Item $installer
          if ($file.Length -lt 1MB) { throw 'Installer is unexpectedly small' }
          $stream = [IO.File]::OpenRead($file.FullName)
          try { if ($stream.ReadByte() -ne 77 -or $stream.ReadByte() -ne 90) { throw 'Installer is not a Windows executable' } } finally { $stream.Dispose() }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content build-evidence/SHA256SUMS.txt
          $manifest = Get-Content build-evidence/build-manifest.json -Raw | ConvertFrom-Json
          $manifest | Add-Member -NotePropertyName installer -NotePropertyValue $file.Name
          $manifest | Add-Member -NotePropertyName installer_bytes -NotePropertyValue $file.Length
          $manifest | Add-Member -NotePropertyName sha256 -NotePropertyValue $hash
          $manifest | ConvertTo-Json | Set-Content build-evidence/build-manifest.json
          git diff --name-only | Set-Content build-evidence/build-modified-paths.txt
          Write-Host "Installer: $($file.Name); bytes: $($file.Length); SHA256: $hash"
      - name: Upload installer and provenance
        uses: actions/upload-artifact@v4
        with:
          name: Memmy-1.1.8-Windows-CH-d5e79e0b7
          path: |
            App/shell/desktop/release/Memmy-1.1.8-win32-x64-cn-unsigned.exe
            build-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: historical-ch-build-diagnostics
          path: |
            build-evidence/
            App/shell/desktop/release/logs/
          retention-days: 7

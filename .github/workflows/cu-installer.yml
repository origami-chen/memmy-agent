name: Windows CU acceptance installer
on:
  push:
    branches: [codex/package-cu-v128-ad7fea9e2]
    paths: [.github/workflows/cu-installer.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 100
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      MEMMY_CLOUD_SERVICE: https://api.memmy.cn
      MEMMY_LEGAL_CN_BASE_URL: https://memmy.cn
      MEMMY_LEGAL_INTL_BASE_URL: https://memmy.bot
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MemTensor/memmy-agent
          ref: ad7fea9e211a0fbb5b672e182eac8df811517475
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          architecture: x64
      - name: Verify input and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ad7fea9e211a0fbb5b672e182eac8df811517475
          node scripts/internal/shared/verify-package-version.mjs --expected 1.2.8
          npm ci --include=dev --no-audit --no-fund
          node - <<'JS'
          const fs = require('node:fs'), path = require('node:path');
          const root = path.resolve('Migrations'), pkg = require(root + '/package.json');
          for (const name of Object.keys({...pkg.dependencies, ...pkg.devDependencies})) {
            const dirs = require.resolve.paths(name);
            if (![path.join(root, 'node_modules'), ...dirs].some(dir => fs.existsSync(path.join(dir, name, 'package.json')))) {
              throw new Error('Missing locked migration dependency: ' + name);
            }
          }
          JS
          python - <<'PYTHON'
          from pathlib import Path
          script=Path('scripts/internal/win/build-nsis.sh')
          source=script.read_text()
          install='npm_with_configured_script_shell install --workspace @memmy/migrations --include=dev --ignore-scripts --package-lock=false --no-audit --no-fund'
          assert source.count(install)==1
          source=source.replace(install,'log "Using verified migration dependencies installed by root npm ci"')
          lock='npm install --prefix "$RUNTIME_DIR/memory" --package-lock-only --ignore-scripts --os=win32 --cpu=x64'
          assert source.count(lock)==1
          source=source.replace(lock,'(cd "$RUNTIME_DIR/memory" && npm install --package-lock-only --ignore-scripts --os=win32 --cpu=x64 --workspaces=false)')
          with script.open('w',newline='\n') as f: f.write(source)
          PYTHON
      - name: Build Windows x64 CN unsigned installer
        shell: bash
        run: |
          set -uo pipefail
          if bash scripts/package-win.sh --version 1.2.8 --arch x64 --edition cn --sign unsigned 2>&1 | tee "$RUNNER_TEMP/cu-build.log"; then
            exit 0
          fi
          echo "Build failed. Capturing the runner's error summary."
          python - <<'PYTHON'
          import os, pathlib, re
          lines=pathlib.Path(os.environ["RUNNER_TEMP"],"cu-build.log").read_text(encoding="utf-8",errors="replace").splitlines()
          relevant=[x for x in lines if re.search(r'error|fail|missing|fatal|cannot|not found|ERR_|invalid|could not|not recognized',x,re.I)]
          selected=list(dict.fromkeys((relevant[:10]+relevant[-5:]) or lines[-8:]))
          for x in selected:
              print("::error::"+x[:600].replace("%","%25"))
          PYTHON
          exit 1
      - name: Hash and seal the installer for transfer
        shell: bash
        run: |
          set -euo pipefail
          cd App/shell/desktop/release
          exe=Memmy-1.2.8-win32-x64-cn-unsigned.exe
          test -s "$exe"
          sha256sum "$exe"
          echo "::notice::Installer SHA256 $(sha256sum "$exe" | cut -d' ' -f1)"
          cat > recipient.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
